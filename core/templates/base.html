<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            color-scheme: light;
            --app-bg: #f3f4f6;
            --app-surface: #ffffff;
            --app-surface-muted: #f8f9fa;
            --app-border: #d1d5db;
            --app-text: #1f2937;
            --app-muted: #6b7280;
            --app-accent: #4b5563;
            --app-accent-strong: #374151;
            --app-shadow: rgba(15, 23, 42, 0.08);
        }

        [data-bs-theme="dark"] {
            color-scheme: dark;
            --app-bg: #111827;
            --app-surface: #1f2937;
            --app-surface-muted: #374151;
            --app-border: #4b5563;
            --app-text: #f3f4f6;
            --app-muted: #cbd5e1;
            --app-accent: #d1d5db;
            --app-accent-strong: #e5e7eb;
            --app-shadow: rgba(0, 0, 0, 0.25);
        }

        body {
            background: linear-gradient(135deg, var(--app-bg) 0%, var(--app-surface-muted) 100%);
            color: var(--app-text);
            min-height: 100vh;
        }

        .navbar,
        .card,
        .list-group-item,
        .alert,
        .form-control,
        .form-select,
        .form-textarea {
            background-color: var(--app-surface) !important;
            color: var(--app-text) !important;
            border-color: var(--app-border) !important;
            box-shadow: 0 10px 30px var(--app-shadow);
        }

        .navbar-brand,
        .nav-link,
        .text-muted,
        .small,
        .card-title,
        .card-text {
            color: var(--app-text) !important;
        }

        .text-muted {
            color: var(--app-muted) !important;
        }

        .hero-panel {
            background: linear-gradient(135deg, var(--app-surface) 0%, var(--app-surface-muted) 100%);
        }

        .btn-outline-secondary {
            border-color: var(--app-border);
            color: var(--app-text);
        }

        .btn-outline-secondary:hover {
            background-color: var(--app-accent);
            color: var(--app-surface);
        }

        .page-shell {
            padding: 2rem 0 3rem;
        }

        input,
        select,
        textarea {
            background-color: var(--app-surface) !important;
            color: var(--app-text) !important;
            border-color: var(--app-border) !important;
        }
    </style>
</head>
<body>
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg border-bottom">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="#">Sunnies</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Restaurants</a>
                        </li>
                        {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="#">My orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Profile</a>
                        </li>
                        {% endif %}
                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="themeToggle" aria-label="Toggle theme">🌙</button>
                        {% if user.is_authenticated %}
                        <span class="navbar-text small text-muted me-2">{{ request.user.username }}</span>
                        <form method="post" action="#" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
                        </form>
                        {% else %}
                        <a class="btn btn-outline-secondary btn-sm" href="#">Login</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="border-top py-4 mt-5">
        <div class="container text-center text-muted small">© 2026 Sunnies</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');

        const applyTheme = (theme) => {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            if (themeToggle) {
                themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        };

        const savedTheme = localStorage.getItem('theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        applyTheme(savedTheme || systemTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const nextTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(nextTheme);
            });
        }
    </script>

    {% block scripts %}{% endblock %}
    
</body>
</html>
