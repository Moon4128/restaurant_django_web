{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h3 mb-3">Delete Review</h2>
                <p class="text-muted">Are you sure you want to delete this review?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a class="btn btn-outline-secondary" href="{% url 'core:restaurant_detail' review.restaurant.pk %}">Go back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
